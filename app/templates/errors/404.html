{% extends "base.html" %}

{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card card-custom p-5">
        <div class="category-icon mx-auto mb-3 text-info bg-info-subtle" style="width: 70px; height: 70px; font-size: 2rem;">
          <i class="bi bi-question-circle"></i>
        </div>
        <h2 class="fw-bold text-dark mb-2">Page Not Found (404)</h2>
        <p class="text-muted mb-4">The listing, user, or page you are looking for does not exist or may have been removed.</p>
        <div>
          <a href="{{ url_for('main.index') }}" class="btn btn-primary-custom">
            <i class="bi bi-house me-1"></i> Return to Homepage
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
